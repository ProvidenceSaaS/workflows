name: Build & Push to ECR

on:
  workflow_call:
    inputs:
      ecr_repo_name:
        description: "ECR repository name"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      build_args:
        description: "Newline-separated Docker build args"
        required: false
        type: string
        default: ""
      environment:
        description: "Deployment environment (e.g. prod, staging)"
        required: false
        type: string
        default: "prod"
      platforms:
        description: "Target platforms for buildx"
        required: false
        type: string
        default: "linux/amd64"
      use_oidc:
        description: "Use OIDC role for AWS auth (true) or access keys (false)"
        required: false
        type: boolean
        default: true
    outputs:
      image_uri:
        description: "Full image URI with tag"
        value: ${{ jobs.build-push.outputs.image_uri }}
      image_digest:
        description: "Image digest (sha256)"
        value: ${{ jobs.build-push.outputs.image_digest }}

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.output.outputs.image_uri }}
      image_digest: ${{ steps.output.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.use_oidc }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Configure AWS credentials (Access Keys)
        if: ${{ !inputs.use_oidc }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPO: ${{ inputs.ecr_repo_name }}
          ENV: ${{ inputs.environment }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          IMAGE_BASE="${ECR_REGISTRY}/${ECR_REPO}"

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE_BASE}:${ENV}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE_BASE}:${ENV}-latest" >> "$GITHUB_OUTPUT"
          echo "${IMAGE_BASE}:${ENV}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "primary_tag=${IMAGE_BASE}:${ENV}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Set outputs
        id: output
        run: |
          echo "image_uri=${{ steps.meta.outputs.primary_tag }}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Summary
        run: |
          echo "### Docker Image Published :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${{ steps.meta.outputs.primary_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Digest** | \`${{ steps.build.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trivy scan** | [View results](../security/code-scanning) |" >> "$GITHUB_STEP_SUMMARY"
