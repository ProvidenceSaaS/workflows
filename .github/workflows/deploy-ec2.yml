name: Deploy to EC2 via SSM

on:
  workflow_call:
    inputs:
      instance_id:
        description: "EC2 instance ID"
        required: true
        type: string
      image_uri:
        description: "Full ECR image URI with tag"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      container_name:
        description: "Docker container name"
        required: true
        type: string
      host_port:
        description: "Host port to map"
        required: false
        type: string
        default: "80"
      container_port:
        description: "Container port"
        required: false
        type: string
        default: "3000"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          IMAGE_URI: ${{ inputs.image_uri }}
          CONTAINER: ${{ inputs.container_name }}
          HOST_PORT: ${{ inputs.host_port }}
          CONTAINER_PORT: ${{ inputs.container_port }}
          REGION: ${{ inputs.aws_region }}
        run: |
          COMMANDS=$(jq -nc \
            --arg region "$REGION" \
            --arg image "$IMAGE_URI" \
            --arg name "$CONTAINER" \
            --arg hp "$HOST_PORT" \
            --arg cp "$CONTAINER_PORT" \
            '{commands: [
              "set -e",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr." + $region + ".amazonaws.com"),
              ("docker pull " + $image),
              ("docker stop " + $name + " 2>/dev/null || true"),
              ("docker rm " + $name + " 2>/dev/null || true"),
              ("docker run -d --name " + $name + " --restart unless-stopped -p " + $hp + ":" + $cp + " " + $image)
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            sleep 10
            RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || echo '{"Status":"InProgress"}')
            STATUS=$(echo "$RESULT" | jq -r '.Status')
            echo "Attempt $i: $STATUS"

            case "$STATUS" in
              Success)
                echo "$RESULT" | jq -r '.StandardOutputContent'
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Deploy failed: $STATUS"
                echo "$RESULT" | jq -r '.StandardErrorContent'
                exit 1
                ;;
            esac
          done

          echo "::error::Timed out waiting for deploy"
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "### Deploy to EC2 :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Instance** | \`${{ inputs.instance_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${{ inputs.image_uri }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Container** | \`${{ inputs.container_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Port** | \`${{ inputs.host_port }}:${{ inputs.container_port }}\` |" >> "$GITHUB_STEP_SUMMARY"
